<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPM Mastery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: fixed left rail (subjects + tools) beside a reading column; question cards styled like an SPM answer paper. */
:root {
  --bg: #F2F4F8; --surface: #FFFFFF; --surface-2: #E8ECF3; --ink: #131A2B; --muted: #586276; --line: #D6DCE6;
  --accent: #1E3FB8; --accent-ink: #FFFFFF; --good: #17784C; --warn: #A65A06; --bad: #BF2F1B;
  --good-bg: #E3F4EA; --warn-bg: #FBF0DE; --bad-bg: #FBE6E2;
  --c-sejarah: #A23E2A; --c-bm: #0E7768; --c-bi: #7339AE; --c-sains: #0A6B9E; --c-math: #A85C05;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r: 10px; --shadow: 0 1px 2px rgb(19 26 43 / .06), 0 4px 16px rgb(19 26 43 / .05);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D111A; --surface: #151B27; --surface-2: #1D2432; --ink: #E6EAF2; --muted: #98A2B6; --line: #2A3243;
  --accent: #8CA2FF; --accent-ink: #0D111A; --good: #43D08E; --warn: #F2A43A; --bad: #FF7A66;
  --good-bg: #12291E; --warn-bg: #2E2312; --bad-bg: #331915;
  --c-sejarah: #F08B6F; --c-bm: #43CDB7; --c-bi: #C49BFF; --c-sains: #5CC0F0; --c-math: #F2A846;
  --shadow: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D111A; --surface: #151B27; --surface-2: #1D2432; --ink: #E6EAF2; --muted: #98A2B6; --line: #2A3243;
  --accent: #8CA2FF; --accent-ink: #0D111A; --good: #43D08E; --warn: #F2A43A; --bad: #FF7A66;
  --good-bg: #12291E; --warn-bg: #2E2312; --bad-bg: #331915;
  --c-sejarah: #F08B6F; --c-bm: #43CDB7; --c-bi: #C49BFF; --c-sains: #5CC0F0; --c-math: #F2A846;
  --shadow: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-body); margin: 0 }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0 }
h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 800; letter-spacing: -.01em }
h2 { font-size: 1.35rem; font-weight: 700 }
h3 { font-size: 1.08rem; font-weight: 700 }
a { color: var(--accent) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.small { font-size: .88rem }
.eyebrow { font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700 }

/* shell */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100% }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface);
  padding: 20px 14px; display: flex; flex-direction: column; gap: 18px }
.brand { display: flex; align-items: baseline; gap: 6px; padding: 0 8px; text-decoration: none; color: var(--ink) }
.brand b { font: 800 1.3rem var(--f-display); letter-spacing: -.02em }
.brand span { font: 600 .72rem var(--f-mono); color: var(--accent); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px }
.nav { display: flex; flex-direction: column; gap: 2px }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 600 }
.nav a:hover { background: var(--surface-2) }
.nav a[aria-current="page"] { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--sc, var(--accent)) }
.nav .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--sc, var(--muted)); flex: none }
.nav .count { margin-left: auto; font: 600 .75rem var(--f-mono); color: var(--muted) }
.topbar { display: none }
main { padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0 }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px }
.narrow { max-width: 780px }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr }
  .rail { position: fixed; inset: 0 auto 0 0; width: min(290px, 86vw); z-index: 30; transform: translateX(-102%); transition: transform .2s; height: 100%;
    padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px)) }
  .app.open .rail { transform: none; box-shadow: 0 0 0 100vmax rgb(0 0 0 / .35) }
  .topbar { display: flex; align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--surface) }
  main { padding-top: 18px }
}

/* building blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0 }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)) }
.grid.stats { grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)) }
.grid-2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)) }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.stack { display: flex; flex-direction: column; gap: 10px }
.spacer { flex: 1 }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; line-height: 1.3 }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.subject { background: var(--sc); border-color: var(--sc); color: var(--bg) }
.btn.danger { color: var(--bad); border-color: var(--bad) }
.btn.ghost { border-color: transparent; background: none }
.btn:disabled { opacity: .45; cursor: not-allowed }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .76rem; font-weight: 700; padding: 2px 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--muted); white-space: nowrap }
.chip.high { background: var(--bad-bg); color: var(--bad) }
.chip.med { background: var(--warn-bg); color: var(--warn) }
.chip.low { background: var(--surface-2); color: var(--muted) }
.chip.good { background: var(--good-bg); color: var(--good) }
.chip.kbat { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent) }
.chip.verified { background: var(--good-bg); color: var(--good) }
.chip.reported { background: var(--warn-bg); color: var(--warn) }
.chip.unverified { background: var(--bad-bg); color: var(--bad) }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden }
.bar > i { display: block; height: 100%; background: var(--sc, var(--accent)); border-radius: inherit }
.subject-head { border-radius: var(--r); padding: 22px; background: color-mix(in srgb, var(--sc) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--sc) 30%, var(--line)) }
.subject-head .code { font: 600 .8rem var(--f-mono); color: var(--sc) }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto }
.tabs a { padding: 9px 14px; text-decoration: none; color: var(--muted); font-weight: 700; border-bottom: 3px solid transparent; white-space: nowrap }
.tabs a[aria-current="page"] { color: var(--ink); border-color: var(--sc, var(--accent)) }
.chapter-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 140px; gap: 12px; align-items: center; padding: 12px 6px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none }
.chapter-row:hover { background: var(--surface-2) }
.chapter-row .num { font: 600 .9rem var(--f-mono); color: var(--sc); text-align: center }
@media (max-width: 560px) { .chapter-row { grid-template-columns: 34px minmax(0, 1fr) } .chapter-row .meter { grid-column: 2 } }
.stat b { display: block; font: 800 1.9rem/1 var(--f-display); letter-spacing: -.02em }
.empty { text-align: center; padding: 32px 16px; color: var(--muted); border: 1.5px dashed var(--line); border-radius: var(--r) }
.notice { padding: 12px 14px; border-radius: 8px; background: var(--warn-bg); color: var(--ink); border-left: 4px solid var(--warn) }
.notice.info { background: var(--surface-2); border-left-color: var(--accent) }
.list-plain { list-style: none; margin: 0; padding: 0 }
.list-plain li { padding: 9px 0; border-bottom: 1px solid var(--line) }
.list-plain li:last-child { border-bottom: 0 }
table { border-collapse: collapse; width: 100% }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-size: .85rem; color: var(--muted); font-weight: 700 }
.scroll-x { overflow-x: auto; max-width: 100% }
label.check { display: flex; gap: 8px; align-items: flex-start; cursor: pointer }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 17px; height: 17px; margin-top: 3px; flex: none }
input[type=text], input[type=number], input[type=date], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 100% }
textarea { width: 100%; min-height: 140px; resize: vertical; line-height: 1.5 }
fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin: 0; min-width: 0 }
legend { font-weight: 700; padding: 0 6px }
.chips-input { display: flex; flex-wrap: wrap; gap: 8px }
.chips-input label { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 8px; cursor: pointer; background: var(--surface) }
.chips-input input { margin: 0 }

/* rendered markdown */
.md { min-width: 0; overflow-wrap: break-word }
.md > * + * { margin-top: .75em }
.md h2 { margin-top: 1.4em; font-size: 1.25rem } .md h3 { margin-top: 1.2em } .md h4 { margin-top: 1em; font-size: 1rem }
.md p, .md ul, .md ol { margin-bottom: 0 }
.md ul, .md ol { padding-left: 1.3em } .md li + li { margin-top: .25em }
.md blockquote { margin-inline: 0; padding: 10px 14px; border-radius: 8px; background: color-mix(in srgb, var(--sc, var(--accent)) 10%, var(--surface)); border-left: 4px solid var(--sc, var(--accent)) }
.md code { font-family: var(--f-mono); font-size: .9em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px }
.md .scroll-x table { min-width: 420px; font-size: .95rem }
.md svg { display: block; height: auto; margin: 8px 0 }
.prose { max-width: 72ch } .narrow .prose { max-width: none }

/* exam paper */
.paper { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: clamp(16px, 3vw, 28px); box-shadow: var(--shadow) }
.qhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 14px }
.qhead .qn { font: 800 1.1rem var(--f-display) }
.marks { margin-left: auto; font: 600 .85rem var(--f-mono); color: var(--muted) }
.stimulus { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 14px 16px }
.stimulus .eyebrow { margin-bottom: 6px }
.part { border-top: 1px dashed var(--line); padding-top: 14px; margin-top: 14px }
.part-label { font: 700 1rem var(--f-mono); margin-right: 6px }
.opts { display: flex; flex-direction: column; gap: 8px; margin-top: 12px }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface) }
.opt:hover { border-color: var(--muted) }
.opt input { position: absolute; opacity: 0; pointer-events: none }
.opt .key { font: 700 .9rem var(--f-mono); width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; flex: none }
.opt:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)) }
.opt:has(input:checked) .key { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.opt:has(input:focus-visible) { outline: 2px solid var(--accent) }
.opt.correct, .opt.correct:has(input:checked) { border-color: var(--good); background: var(--good-bg) }
.opt.correct .key, .opt.correct:has(input:checked) .key { background: var(--good); color: var(--surface); border-color: var(--good) }
.opt.wrong, .opt.wrong:has(input:checked) { border-color: var(--bad); background: var(--bad-bg) }
.opt.wrong:has(input:checked) .key { background: var(--bad); color: var(--surface); border-color: var(--bad) }
.match-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px 0 }
@media (max-width: 560px) { .match-row { grid-template-columns: 1fr } }
.match-row select { width: 100% }
.blank-input { display: inline-block; width: 12em; margin: 2px 4px }
.feedback { border-radius: 8px; padding: 14px 16px; margin-top: 14px; border: 1px solid var(--line) }
.feedback.ok { background: var(--good-bg); border-color: color-mix(in srgb, var(--good) 40%, transparent) }
.feedback.no { background: var(--bad-bg); border-color: color-mix(in srgb, var(--bad) 40%, transparent) }
.feedback.self { background: var(--surface-2) }
.verdict { font-weight: 800; font-family: var(--f-display) }
.ok .verdict { color: var(--good) } .no .verdict { color: var(--bad) }
.navgrid { display: flex; flex-wrap: wrap; gap: 6px }
.navgrid button { width: 38px; height: 34px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font: 600 .8rem var(--f-mono); cursor: pointer }
.navgrid button.answered { background: var(--surface-2); border-color: var(--muted) }
.navgrid button.cur { outline: 2px solid var(--accent) }
.navgrid button.flag { box-shadow: inset 0 -3px 0 var(--warn) }
.navgrid button.right { background: var(--good-bg); border-color: var(--good) } .navgrid button.wrongq { background: var(--bad-bg); border-color: var(--bad) }
.timer { font: 600 1.15rem var(--f-mono); padding: 4px 12px; border-radius: 8px; background: var(--surface-2) }
.timer.low { background: var(--bad-bg); color: var(--bad) }
.runbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line) }
@media (max-width: 860px) { .runbar { top: calc(57px + env(safe-area-inset-top, 0px)) } }
.rubric li { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0 }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 50; font-weight: 600 }
.ring text { font-family: var(--f-display); font-weight: 800; fill: var(--ink) }
.chart text { font: 11px var(--f-mono); fill: var(--muted) }
details > summary { cursor: pointer; font-weight: 700 }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="Main navigation"></aside>
  <div style="min-width:0">
    <div class="topbar"><button class="btn" data-action="menu" aria-label="Open menu">☰ Menu</button><b style="font-family:var(--f-display)">SPM Mastery</b></div>
    <main id="main" tabindex="-1"><div class="wrap"><p class="muted">Loading…</p></div></main>
  </div>
</div>

<script>window.SPM = { subjects: [], add(s) { this.subjects.push(s) } };</script>
<script src="data/sejarah.js"></script>
<script src="data/bm.js"></script>
<script src="data/bi.js"></script>
<script src="data/sains.js"></script>
<script src="data/math.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
